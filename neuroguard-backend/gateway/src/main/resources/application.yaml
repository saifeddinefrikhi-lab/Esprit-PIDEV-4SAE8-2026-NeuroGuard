server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/neuroguard}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/neuroguard/protocol/openid-connect/certs}
          # Note: En Docker, KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/neuroguard (via docker-compose env)
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
              - "http://localhost:80"
              - "http://localhost"
              - "http://frontend"
              - "http://frontend:80"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
              - "Content-Type"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-auth
          uri: lb://user-service
          predicates:
            - Path=/auth/**
        - id: user-users
          uri: lb://user-service
          predicates:
            - Path=/users/**,/api/users/**
        - id: consultation-service
          uri: lb://consultation-service
          predicates:
            - Path=/api/consultations/**
        - id: availability-service
          uri: lb://consultation-service
          predicates:
            - Path=/api/availability/**
        - id: consultation-providers
          uri: lb://consultation-service
          predicates:
            - Path=/api/providers/**
        - id: consultation-distance
          uri: lb://consultation-service
          predicates:
            - Path=/api/distance/**
        - id: reservation-service
          uri: lb://reservation-service
          predicates:
            - Path=/api/reservations/**

app:
  security:
    keycloak-enabled: ${KEYCLOAK_SECURITY_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Consultation Service
        url: /api/consultations/v3/api-docs
      - name: Reservation Service
        url: /api/reservations/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
