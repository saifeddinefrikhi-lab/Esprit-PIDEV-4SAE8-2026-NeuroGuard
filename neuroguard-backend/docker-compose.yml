services:
  # --- Databases ---
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: consultation_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - neuroguard-net

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - neuroguard-net

  # --- Message Broker (communication asynchrone) ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - neuroguard-net

  # --- Security (Keycloak) ---
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/neuroguard-realm.json:/opt/keycloak/data/import/neuroguard-realm.json
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - neuroguard-net

  # --- Monitoring (Bonus) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - neuroguard-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - neuroguard-net

  # --- Infrastructure Microservices ---
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - neuroguard-net

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - neuroguard-net

  api-gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # IMPORTANT: ISSUER_URI doit utiliser le nom interne Docker (keycloak:8080)
      # pour que le gateway puisse valider les tokens en interne
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/neuroguard
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/neuroguard/protocol/openid-connect/certs
      - KEYCLOAK_SECURITY_ENABLED=true
    networks:
      - neuroguard-net

  user-service:
    build: ./user-service
    container_name: user-service
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/userdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=user-service
    networks:
      - neuroguard-net

  # --- Business Microservices ---
  consultation-service:
    build: ./consultation-service
    container_name: consultation-service
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/consultation_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=consultation-service
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/neuroguard
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/neuroguard/protocol/openid-connect/certs
    networks:
      - neuroguard-net

  reservation-service:
    build: ./reservation-service
    container_name: reservation-service
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/reservation_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - EUREKA_INSTANCE_HOSTNAME=reservation-service
      - EUREKA_INSTANCE_IP=reservation-service
      - CONSULTATION_SERVICE_URL=http://consultation-service:8090
    networks:
      - neuroguard-net

  # --- Frontend Angular (servi via nginx) ---
  frontend:
    build:
      context: ../FrontEnd
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
      - keycloak
    networks:
      - neuroguard-net

networks:
  neuroguard-net:
    driver: bridge
