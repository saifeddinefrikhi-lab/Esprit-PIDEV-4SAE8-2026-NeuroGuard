<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="card auth-card my-5">
        <div class="card-body auth-card-body">
          <div class="auth-header">
            <div>
              <h3 class="auth-title">Login</h3>
              <p class="auth-subtitle">Welcome back. Sign in to continue.</p>
            </div>
          </div>

          <!-- Success Alert -->
          <div class="alert alert-success alert-dismissible fade show" role="alert" *ngIf="successMessage">
            <i class="ti ti-check-circle me-2"></i>
            {{ successMessage }}
            <button type="button" class="btn-close" (click)="clearMessages()" aria-label="Close"></button>
          </div>

          <!-- Error Alert -->
          <div class="alert alert-danger alert-dismissible fade show" role="alert" *ngIf="errorMessage">
            <i class="ti ti-alert-circle me-2"></i>
            <strong>Error!</strong> {{ errorMessage }}
            <button type="button" class="btn-close" (click)="clearMessages()" aria-label="Close"></button>
          </div>

          <div class="text-center mb-4">
            <p class="text-muted mb-0">L’accès se fait uniquement via Keycloak pour les comptes protégés.</p>
          </div>

          <div class="alert alert-info mb-4" *ngIf="isLoading && !errorMessage">
            Redirection vers Keycloak en cours...
          </div>

          <div class="d-grid">
            <button type="button" class="btn btn-success btn-auth" (click)="loginWithKeycloak()" [disabled]="isLoading">
              <span *ngIf="!isLoading">
                <i class="ti ti-shield-lock me-2"></i>
                Se connecter avec Keycloak
              </span>
              <span *ngIf="isLoading">
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Redirection vers Keycloak...
              </span>
            </button>
          </div>

          <p class="mt-3 text-center text-muted">
            Vous n’avez pas encore de compte ?
            <a [routerLink]="['/register']" class="link-primary fw-semibold">Créer un compte</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
